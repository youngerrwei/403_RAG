<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LAB-403 登录</title>
    <style nonce="{{ nonce }}">
        :root {
            --bg: #F5F9F7;
            --panel: #ffffff;
            --border: #E5E5EA;
            --text: #1C1C1E;
            --subtext: #8E8E93;
            --primary: #006B3F;
            --primary-hover: #004D2E;
            --danger: #FF3B30;
            --success: #006B3F;
            --accent-gold: #C4A84A;
            --shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(160deg, #ffffff 0%, #e8f5e9 30%, #a5d6a7 60%, #2E8B57 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        /* 装饰性 blob - 让毛玻璃有内容可模糊 */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: -10%;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background: rgba(0, 107, 63, 0.25);
            filter: blur(80px);
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            right: -10%;
            width: 50%;
            height: 50%;
            border-radius: 50%;
            background: rgba(196, 168, 74, 0.15);
            filter: blur(80px);
            z-index: 0;
        }
        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
        }
        h1 {
            margin: 0 0 8px;
            color: #006B3F;
            font-size: 28px;
            font-weight: 700;
        }
        .subtitle {
            margin: 0 0 10px;
            font-size: 13px;
            color: var(--subtext);
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        p.desc {
            margin: 0 0 28px;
            color: var(--subtext);
            line-height: 1.7;
            font-size: 14px;
        }
        .form-group {
            position: relative;
            margin-bottom: 24px;
        }
        .form-group input {
            width: 100%;
            padding: 16px 14px 8px;
            border: 1.5px solid #E5E5EA;
            border-radius: 10px;
            font-size: 15px;
            background: #F9FAF9;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }
        .form-group input:focus {
            border-color: #006B3F;
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 107, 63, 0.1);
        }
        .form-group label {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8E8E93;
            font-size: 15px;
            transition: all 0.2s ease;
            pointer-events: none;
            background: transparent;
            padding: 0 4px;
        }
        .form-group input:focus + label,
        .form-group input:not(:placeholder-shown) + label {
            top: 6px;
            transform: translateY(0);
            font-size: 11px;
            color: #006B3F;
            background: white;
        }
        button {
            background: linear-gradient(135deg, #006B3F, #2E8B57);
            border: none;
            border-radius: 10px;
            color: white;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 107, 63, 0.3);
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 107, 63, 0.35);
        }
        button:active {
            transform: scale(0.96);
            transition: transform 0.1s ease;
        }
        button.loading {
            pointer-events: none;
            opacity: 0.7;
        }
        button.loading::after {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .pwd-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            opacity: 0.5;
            transition: opacity 0.2s;
            box-shadow: none;
            width: auto;
        }
        .pwd-toggle:hover {
            opacity: 1;
            transform: translateY(-50%);
            box-shadow: none;
        }
        .pwd-toggle { color: #8E8E93; }
        .pwd-toggle:hover { color: #006B3F; }
        .status {
            min-height: 24px;
            margin-top: 14px;
            font-size: 14px;
            text-align: center;
        }
        .status.error {
            color: var(--danger);
        }
        .status.success {
            color: #006B3F;
        }

        /* 暗色模式 */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #071A10 0%, #0A2E1A 100%);
            }
            body::before {
                background: rgba(0, 107, 63, 0.1);
            }
            body::after {
                background: rgba(196, 168, 74, 0.06);
            }
            .login-card {
                background: rgba(28, 28, 30, 0.9);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-color: rgba(56, 56, 58, 0.6);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            }
            .login-card h1 { color: #C4A84A; }
            .login-card .subtitle { color: #8E8E93; }
            .login-card .desc { color: #8E8E93; }
            .form-group input {
                background: #2C2C2E;
                border-color: #38383A;
                color: #FFFFFF;
            }
            .form-group input:focus {
                border-color: #2E8B57;
                background: #1C1C1E;
                box-shadow: 0 0 0 4px rgba(46, 139, 87, 0.15);
            }
            .form-group label { color: #8E8E93; }
            .form-group input:focus + label,
            .form-group input:not(:placeholder-shown) + label {
                color: #2E8B57;
                background: #2C2C2E;
            }
            button { background: linear-gradient(135deg, #2E8B57, #3A9D5C); box-shadow: 0 4px 15px rgba(46, 139, 87, 0.3); }
            button:hover { box-shadow: 0 8px 20px rgba(46, 139, 87, 0.4); }
            .status.error { color: #FF453A; }
            .status.success { color: #2E8B57; }
        }

        /* 减弱动画偏好支持 */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ===== 浏览器兼容性兜底 ===== */

        /* 1. backdrop-filter 不支持时的 fallback */
        @supports not (backdrop-filter: blur(1px)) {
            .login-card { background: #ffffff; }
            @media (prefers-color-scheme: dark) {
                .login-card { background: #1C1C1E; }
            }
        }

        /* 2. IE 及不支持 CSS 变量的浏览器 - 关键元素 fallback */
        body { color: #1C1C1E; background-color: #e8f5e9; }
        .login-card { background-color: #ffffff; }
        .status.error { color: #FF3B30; }
        .credits {
            margin: 24px 0 0;
            text-align: center;
            font-size: 11px;
            color: #8E8E93;
            letter-spacing: 0.5px;
        }
        .sysu-logo {
            display: block;
            width: 120px;
            height: 120px;
            margin: 20px auto 12px;
            object-fit: contain;
            border-radius: 0;
            background: none;
            border: none;
            padding: 0;
            filter: sepia(1) saturate(5) hue-rotate(95deg) brightness(0.4) contrast(1.2);
        }
        @media (prefers-color-scheme: dark) {
            .sysu-logo {
                filter: sepia(1) saturate(5) hue-rotate(95deg) brightness(0.6) contrast(1.1);
            }
        }
    </style>
</head>

        <h1>LAB-403 登录</h1>
        <p class="desc">请输入本系统分配的用户名和密码进行登录</p>

        <div class="form-group">
            <input id="username" type="text" placeholder=" " />
            <label for="username">用户名</label>
        </div>

        <div class="form-group">
            <input id="password" type="password" placeholder=" " />
            <label for="password">密码</label>
            <button type="button" class="pwd-toggle" id="pwdToggleBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </div>

        <button id="loginBtn">登录</button>
        <div id="status" class="status"></div>
        <p class="credits">Developed and maintained by ZiyangWei</p>
    </div>

    <script nonce="{{ nonce }}">
        function setStatus(msg = "", type = "") {
            const el = document.getElementById("status");
            el.className = "status";
            if (type) el.classList.add(type);
            el.textContent = msg;
        }

        function togglePassword() {
            const pwd = document.getElementById('password');
            const btn = document.querySelector('.pwd-toggle');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
            } else {
                pwd.type = 'password';
                btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            }
        }

        async function login() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const btn = document.getElementById("loginBtn");

            if (!username || !password) {
                setStatus("用户名和密码不能为空！", "error");
                return;
            }

            btn.classList.add("loading");
            setStatus("");

            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!data.success) {
                    setStatus(data.error || "登录失败！", "error");
                    btn.classList.remove("loading");
                    return;
                }

                setStatus("登录成功，正在跳转...", "success");
                setTimeout(() => {
                    window.location.href = "/";
                }, 500);

            } catch (e) {
                setStatus("请求异常：" + e, "error");
                btn.classList.remove("loading");
            }
        }

        // 事件绑定（避免 onclick 内联属性被 CSP 阻止）
        document.getElementById("pwdToggleBtn").addEventListener("click", togglePassword);
        document.getElementById("loginBtn").addEventListener("click", login);
        document.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                login();
            }
        });
    </script>
</body>
